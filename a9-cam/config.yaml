name: A9 Camera
version: 3.2.1
slug: a9-cam
description: Local server for A9 / V720 mini cameras, no cloud
url: https://github.com/dbuezas/a9-camera-ha-add-on
image: ghcr.io/dbuezas/{arch}-a9-cam
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: application
host_network: true
ingress: true
ingress_port: 8557
# Direct links on port 8557 ask for a Home Assistant user and password and
# check them against the Supervisor's auth API.
auth_api: true
# Needed for /network/interface/... (Wi-Fi scan + connect) on the HA host.
hassio_api: true
hassio_role: manager
panel_icon: mdi:cctv
discovery:
  - a9_cam
ports:
  80/tcp: 80
  6123/tcp: 6123
  6123/udp: 6123
  # RTSP has no login, so it stays off unless the user enables it.
  8556/tcp:
  # Direct links work after a Home Assistant login; ingress also works.
  8557/tcp: 8557
ports_description:
  80/tcp: Cloud API for the cameras (they always call port 80)
  6123/tcp: Camera control channel
  6123/udp: Camera video and audio
  8556/tcp: RTSP (MJPEG video + PCMA audio), off by default
  8557/tcp: Web UI, MJPEG, snapshots and the integration API (HA login required)
options:
  log_level: info
  camera_http_port: 80
  ui_allowed_cidrs: ""
schema:
  log_level: list(trace|debug|info|warn|error)
  camera_http_port: int(0,65535)
  ui_allowed_cidrs: str
