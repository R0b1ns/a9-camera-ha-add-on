<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A9 Cameras</title>
  <style>
    :root {
      --bg: #f6f7f9; --card: #fff; --text: #1c1e21; --muted: #65676b;
      --line: #dfe1e5; --accent: #0b6bcb; --ok: #1a7f37; --err: #b3261e; --warn: #9a6700;
      --code: #eef0f3;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #111315; --card: #1b1e21; --text: #e4e6eb; --muted: #a0a4ab;
        --line: #2f3338; --accent: #5aa7ff; --ok: #4ac26b; --err: #ff8a80; --warn: #e3b341;
        --code: #24282d;
      }
    }
    :root[data-theme="dark"] {
      --bg: #111315; --card: #1b1e21; --text: #e4e6eb; --muted: #a0a4ab;
      --line: #2f3338; --accent: #5aa7ff; --ok: #4ac26b; --err: #ff8a80; --warn: #e3b341; --code: #24282d;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--text);
      font: 15px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .page-head { display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 10px 16px; margin-bottom: 8px; }
    .page-head h1 { margin: 0; }
    .btn-add { display: inline-flex; align-items: center; gap: 6px; font: inherit;
      font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 8px;
      background: var(--accent); color: #fff; text-decoration: none;
      border: 1px solid var(--accent); }
    .btn-add:hover { filter: brightness(1.08); color: #fff; }
    .btn-add svg { width: 14px; height: 14px; flex: none; }
    .muted { color: var(--muted); }
    .cam-count { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
    .dns-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
      font-weight: 600; padding: 4px 10px; border-radius: 99px; white-space: nowrap;
      background: color-mix(in srgb, var(--warn) 12%, var(--card)); color: var(--warn); }
    .dns-badge[data-kind="ok"] { background: color-mix(in srgb, var(--ok) 14%, var(--card)); color: var(--ok); }
    .dns-badge[data-kind="bad"] { background: color-mix(in srgb, var(--err) 12%, var(--card)); color: var(--err); }
    .alert { margin: 10px 0; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--err);
      background: color-mix(in srgb, var(--err) 10%, var(--card)); color: var(--text); }
    .alert b { color: var(--err); }
    .alert code { display: inline; padding: 1px 4px; }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); margin-top: 16px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .card img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: #000; }
    .body { padding: 12px 14px; }
    .title { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .title b { font-size: 16px; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
    .dot.on { background: var(--ok); }
    .row { margin-top: 10px; }
    .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    code { display: block; background: var(--code); padding: 6px 8px; border-radius: 6px; font-size: 13px;
      overflow-wrap: anywhere; user-select: all; }
    .buttons { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    button, a.btn { font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 6px; border: 1px solid var(--line);
      background: var(--card); color: var(--text); cursor: pointer; text-decoration: none; }
    button:hover, a.btn:hover { border-color: var(--accent); color: var(--accent); }
    button:disabled { opacity: .5; cursor: default; }
    .buttons .wifi-open { border-color: var(--accent); color: var(--accent); }
    dialog { width: min(420px, calc(100vw - 24px)); padding: 0; border: 1px solid var(--line);
      border-radius: 12px; background: var(--card); color: var(--text);
      box-shadow: 0 12px 40px rgba(0, 0, 0, .25); }
    dialog::backdrop { background: rgba(0, 0, 0, .45); }
    .modal { padding: 18px; }
    .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .modal h2 { margin: 0; font-size: 17px; }
    .modal .sub { margin: 4px 0 0; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
    .modal-close { border: 0; padding: 0 4px; font-size: 20px; line-height: 1; background: none; }
    .modal label { display: block; margin-top: 14px; font-size: 12px; color: var(--muted); }
    .modal label input { width: 100%; margin-top: 5px; padding: 8px 10px; font: inherit; font-size: 14px;
      border: 1px solid var(--line); border-radius: 7px; background: var(--card); color: var(--text); }
    .modal .wifi-result { min-height: 18px; margin: 10px 0 0; font-size: 13px; color: var(--muted); }
    .modal .wifi-result[data-kind="ok"] { color: var(--ok); }
    .modal .wifi-result[data-kind="err"] { color: var(--err); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    .modal-actions .send { background: var(--accent); border-color: var(--accent); color: #fff; }
    [hidden] { display: none !important; }
    .empty { margin-top: 16px; padding: 28px 20px; text-align: center; background: var(--card);
      border: 1px solid var(--line); border-radius: 12px; }
    .empty-icon { width: 40px; height: 40px; margin: 0 auto 10px; display: grid; place-items: center;
      border-radius: 12px; background: var(--code); color: var(--accent); font-size: 20px; }
    .empty h2 { font-size: 16px; margin: 0 0 4px; }
    .empty p { margin: 0 auto; max-width: 420px; font-size: 14px; color: var(--muted); }
  </style>
</head>
<body>
  <header class="page-head">
    <div>
      <h1>A9 Cameras</h1>
      <p class="cam-count" id="cam-count">Cameras: …</p>
    </div>
    <span class="dns-badge" id="dns-badge" data-kind="warn">DNS-Rewrite …</span>
    <a class="btn-add" data-rel="add" href="setup.html">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"
        stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      Add Camera
    </a>
  </header>
  <div id="alert"></div>
  <div class="muted" id="status">Loading…</div>
  <div class="grid" id="cams"></div>
  <div class="empty" id="empty" hidden>
    <div class="empty-icon">◎</div>
    <h2>No cameras connected</h2>
    <p>Cameras retry every few minutes after a restart. For a new camera in AP mode, use
      <b>Add Camera</b> above.</p>
  </div>

  <dialog id="wifi-modal" aria-labelledby="wifi-modal-title">
    <div class="modal">
      <div class="modal-head">
        <div>
          <h2 id="wifi-modal-title">Change Wi-Fi</h2>
          <p class="sub" id="wifi-modal-cam"></p>
        </div>
        <button class="modal-close" id="wifi-close" type="button" aria-label="Close">×</button>
      </div>
      <label>New Wi-Fi name (SSID)
        <input id="wifi-ssid" autocomplete="off" spellcheck="false" placeholder="SSID">
      </label>
      <label>Password
        <input id="wifi-pwd" type="password" autocomplete="new-password" spellcheck="false"
               placeholder="At least 8 characters">
      </label>
      <p class="wifi-result" id="wifi-result" role="status"></p>
      <div class="modal-actions">
        <button id="wifi-cancel" type="button">Cancel</button>
        <button class="send" id="wifi-send" type="button">Change Wi-Fi</button>
      </div>
    </div>
  </dialog>

  <script>
    const host = location.hostname;
    // Resolve against the *directory* of this page: new URL(".", href) turns
    // /.../index.html into /.../ so links never become /index.html/xyz.
    const pageDir = new URL(".", location.href);
    const rel = path => new URL(path, pageDir).href;
    document.querySelector("[data-rel='add']").href = rel("setup.html");
    // Direct links deliberately use port 8557: the first open asks for the HA login.
    const direct = path => `http://${host}:8557/${path}`;
    const cmds = [
      ["IR on", "code=202&IrLed=1"], ["IR off", "code=202&IrLed=0"],
      ["Flip", "code=216&mirrorFlip=4"], ["No flip", "code=216&mirrorFlip=0"],
      ["LED on", "code=210&instLed=1"], ["LED off", "code=210&instLed=0"],
      ["Reboot", "code=299&reboot=1"],
    ];
    const cards = {};

    const wifiModal = document.getElementById("wifi-modal");
    const wifiSSID = document.getElementById("wifi-ssid");
    const wifiPwd = document.getElementById("wifi-pwd");
    const wifiResult = document.getElementById("wifi-result");
    const wifiSend = document.getElementById("wifi-send");
    let wifiUID = null;

    function wifiStatus(text, kind = "") {
      wifiResult.textContent = text;
      wifiResult.dataset.kind = kind;
    }

    function openWiFi(uid) {
      wifiUID = uid;
      document.getElementById("wifi-modal-cam").textContent = `Connected camera · ${uid}`;
      wifiSSID.value = "";
      wifiPwd.value = "";
      wifiStatus("");
      wifiModal.showModal();
      wifiSSID.focus();
    }

    document.getElementById("wifi-close").onclick = () => wifiModal.close();
    document.getElementById("wifi-cancel").onclick = () => wifiModal.close();
    wifiModal.addEventListener("click", e => { if (e.target === wifiModal) wifiModal.close(); });

    wifiSend.onclick = async () => {
      const ssid = wifiSSID.value.trim();
      const pwd = wifiPwd.value;
      if (!ssid || pwd.length < 8) {
        wifiStatus("Enter an SSID and a password of at least 8 characters.", "err");
        return;
      }
      wifiSend.disabled = true;
      wifiStatus("Sending…");
      try {
        const res = await fetch(rel(`api/devices/${encodeURIComponent(wifiUID)}/wifi`), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ssid, password: pwd }),
        });
        if (!res.ok) throw new Error(await res.text());
        wifiStatus("Sent. The camera will reboot and reconnect.", "ok");
        wifiPwd.value = "";
      } catch (e) {
        wifiStatus(`Failed: ${e.message}`, "err");
      } finally {
        wifiSend.disabled = false;
      }
    };

    function card(cam) {
      const el = document.createElement("div");
      el.className = "card";
      el.innerHTML = `
        <img alt="">
        <div class="body">
          <div class="title"><b></b><span class="muted state"></span></div>
          <div class="row"><div class="label">RTSP (MJPEG + audio)</div><code class="rtsp"></code></div>
          <div class="row"><div class="label">MJPEG</div><code class="mjpeg"></code></div>
          <div class="row"><div class="label">Snapshot</div><code class="snap"></code></div>
          <div class="row buttons">
            <button class="live">Live</button>
            <a class="btn" target="_blank" data-rel="snapshot">Snapshot</a>
            ${cmds.map(([name, q]) => `<button data-q="${q}">${name}</button>`).join("")}
            <button class="wifi-open">Change Wi-Fi</button>
          </div>
        </div>`;
      el.querySelector("b").textContent = cam.uid;
      el.querySelector(".rtsp").textContent = `rtsp://${host}:8556/${cam.uid}`;
      // Direct links keep working; authMiddleware sends unknown browsers to the HA login page.
      el.querySelector(".mjpeg").textContent = direct(`dev/${cam.uid}/live`);
      el.querySelector(".snap").textContent = direct(`dev/${cam.uid}/snapshot`);
      el.querySelector('[data-rel="snapshot"]').href = rel(`dev/${cam.uid}/snapshot`);

      el.querySelector(".wifi-open").onclick = () => openWiFi(cam.uid);
      const img = el.querySelector("img");
      const live = el.querySelector(".live");
      let stop = null;
      live.onclick = () => {
        if (stop) { stop(); return; }
        stop = play(img, cam.uid, () => {
          stop = null;
          live.textContent = "Live";
          img.src = rel(`dev/${cam.uid}/snapshot?t=${Date.now()}`);
        });
        live.textContent = "Stop";
      };
      el.querySelectorAll("button[data-q]").forEach(b =>
        b.onclick = () => fetch(rel(`dev/${cam.uid}/cmd?${b.dataset.q}`)));
      img.src = rel(`dev/${cam.uid}/snapshot?t=${Date.now()}`);
      return el;
    }

    // Shows the live stream in img. Not <img src=live>: HA ingress compresses multipart
    // responses and drops the boundary, so nothing would show. Reads the parts here instead.
    // Returns a function that stops it; onEnd runs once when it ends.
    function play(img, uid, onEnd) {
      const ctrl = new AbortController();
      const dec = new TextDecoder();
      let url = null;
      (async () => {
        const res = await fetch(rel(`dev/${uid}/live?raw`), { signal: ctrl.signal });
        if (!res.ok) throw new Error(res.status);
        const reader = res.body.getReader();
        let buf = new Uint8Array(0);
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          const b = new Uint8Array(buf.length + value.length);
          b.set(buf); b.set(value, buf.length); buf = b;
          // each part: "--frame\r\nContent-Type: image/jpeg\r\nContent-Length: N\r\n\r\n" JPEG "\r\n"
          for (;;) {
            let end = -1;
            for (let i = 0; i + 3 < buf.length; i++) {
              if (buf[i] === 13 && buf[i + 1] === 10 && buf[i + 2] === 13 && buf[i + 3] === 10) { end = i; break; }
            }
            if (end < 0) break;
            const m = dec.decode(buf.subarray(0, end)).match(/Content-Length: (\d+)/i);
            const len = m ? +m[1] : 0;
            if (buf.length < end + 4 + len + 2) break;
            const jpeg = buf.slice(end + 4, end + 4 + len);
            buf = buf.slice(end + 4 + len + 2);
            if (url) URL.revokeObjectURL(url);
            url = URL.createObjectURL(new Blob([jpeg], { type: "image/jpeg" }));
            img.src = url;
          }
        }
      })().catch(() => {}).finally(() => {
        if (url) URL.revokeObjectURL(url);
        onEnd();
      });
      return () => ctrl.abort();
    }

    async function update() {
      let list, st;
      try {
        [list, st] = await Promise.all([
          fetch(rel("dev/list")).then(r => {
            if (!r.ok) throw new Error(r.status);
            return r.json();
          }),
          fetch(rel("api/status")).then(r => r.json()).catch(() => null),
        ]);
      } catch (e) {
        document.getElementById("status").textContent = "Server unreachable";
        document.getElementById("status").hidden = false;
        document.getElementById("empty").hidden = true;
        document.getElementById("cam-count").textContent = "Cameras: –";
        document.getElementById("dns-badge").textContent = "DNS-Rewrite …";
        document.getElementById("dns-badge").dataset.kind = "warn";
        return;
      }
      document.getElementById("cam-count").textContent = `Cameras: ${list.length}`;
      const dns = document.getElementById("dns-badge");
      dns.textContent = `DNS-Rewrite ${st ? (st.dns_ok ? "✓" : "✗") : "…"}`;
      dns.dataset.kind = st ? (st.dns_ok ? "ok" : "bad") : "warn";
      const alert = document.getElementById("alert");
      alert.innerHTML = st && !st.dns_ok ?
        `<div class="alert"><b>DNS redirect missing.</b> <code>${st.dns_name}</code> resolves to ` +
        `<code>${st.dns_ip || "nothing"}</code>, but this host is ` +
        `<code>${(st.local_ips || []).join(", ") || "unknown"}</code>. ` +
        `Set the DNS rewrites for <code>*.naxclow.com</code> and <code>*.naxclow.com.cn</code> ` +
        `in your router/AdGuard, then restart the cameras.</div>` : "";
      document.getElementById("status").textContent = `${list.length} camera(s) connected`;
      document.getElementById("status").hidden = list.length === 0;
      document.getElementById("empty").hidden = list.length !== 0;
      const seen = new Set();
      for (const cam of list) {
        seen.add(cam.uid);
        if (!cards[cam.uid]) {
          cards[cam.uid] = card(cam);
          document.getElementById("cams").appendChild(cards[cam.uid]);
        }
        const v = cam.info && cam.info.version ? ` · fw ${cam.info.version}` : "";
        cards[cam.uid].querySelector(".state").innerHTML =
          `<span class="dot ${cam.streaming ? "on" : ""}"></span>${cam.host}${v}`;
      }
      for (const uid of Object.keys(cards)) {
        if (!seen.has(uid)) { cards[uid].remove(); delete cards[uid]; }
      }
    }

    update();
    setInterval(() => { if (!document.hidden) update(); }, 2000);
  </script>
</body>
</html>
