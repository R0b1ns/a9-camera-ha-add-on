<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A9 Cameras</title>
  <style>
    :root {
      --bg: #f5f6f8; --card: #fff; --text: #1b1f24; --muted: #626b76;
      --line: #e2e6eb; --accent: #1668dc; --accent-soft: #eaf2ff;
      --ok: #16794b; --ok-soft: #e9f7ef; --warn: #8a5a00; --warn-soft: #fff5df;
      --err: #b3261e; --err-soft: #fdecea; --code: #f0f2f5;
      --shadow: 0 2px 10px rgba(20, 30, 45, .06);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #101317; --card: #1a1f26; --text: #e8ebef; --muted: #9aa4b1;
        --line: #2c343e; --accent: #6aa8ff; --accent-soft: #172b46;
        --ok: #5cd295; --ok-soft: #132c20; --warn: #e6ba62; --warn-soft: #2e2413;
        --err: #ff9d95; --err-soft: #351b1b; --code: #12161c; --shadow: none;
      }
    }
    :root[data-theme="dark"] {
      --bg: #101317; --card: #1a1f26; --text: #e8ebef; --muted: #9aa4b1;
      --line: #2c343e; --accent: #6aa8ff; --accent-soft: #172b46;
      --ok: #5cd295; --ok-soft: #132c20; --warn: #e6ba62; --warn-soft: #2e2413;
      --err: #ff9d95; --err-soft: #351b1b; --code: #12161c; --shadow: none;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; padding: 28px 16px 48px; background: var(--bg); color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .shell { max-width: 1120px; margin: 0 auto; }
    a { color: var(--accent); }
    h1 { margin: 0; font-size: 26px; line-height: 1.2; letter-spacing: -.02em; }
    h2 { margin: 0; font-size: 16px; letter-spacing: -.01em; }
    .page-head { display: flex; align-items: flex-start; justify-content: space-between;
      flex-wrap: wrap; gap: 16px; margin-bottom: 20px; }
    .page-head-main { min-width: 0; }
    .eyebrow { margin: 0 0 4px; font-size: 12px; font-weight: 650; letter-spacing: .1em;
      text-transform: uppercase; color: var(--accent); }
    .lede { margin: 4px 0 0; color: var(--muted); }
    .cam-count { margin: 3px 0 0; font-size: 13px; color: var(--muted); }
    .head-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
    .dns-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
      padding: 5px 11px; border-radius: 99px; white-space: nowrap;
      background: var(--warn-soft); color: var(--warn); }
    .dns-badge[data-kind="ok"] { background: var(--ok-soft); color: var(--ok); }
    .dns-badge[data-kind="bad"] { background: var(--err-soft); color: var(--err); }
    .btn-add { display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      font: inherit; font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 9px;
      background: var(--accent); color: #fff; text-decoration: none; border: 1px solid var(--accent); }
    .btn-add:hover { filter: brightness(1.08); color: #fff; }
    .btn-add svg { width: 14px; height: 14px; flex: none; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      font: inherit; font-size: 13px; font-weight: 600; padding: 8px 12px; border-radius: 9px;
      border: 1px solid var(--line); background: var(--card); color: var(--text);
      cursor: pointer; text-decoration: none; transition: filter .15s ease, border-color .15s ease; }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn:focus-visible, .btn-add:focus-visible, input:focus-visible { outline: 2px solid var(--accent);
      outline-offset: 2px; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.primary:hover { color: #fff; filter: brightness(1.08); }
    .btn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
    .btn.wifi { border-color: var(--accent); color: var(--accent); }
    .alert { margin-bottom: 16px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--err);
      background: var(--err-soft); color: var(--text); font-size: 14px; }
    .alert b { color: var(--err); }
    .alert code { display: inline; padding: 1px 4px; background: var(--code); }
    .grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      box-shadow: var(--shadow); overflow: hidden; }
    .grid .card { transition: box-shadow .15s ease, transform .15s ease; }
    .grid .card:hover { box-shadow: 0 8px 24px rgba(20, 30, 45, .12); transform: translateY(-1px); }
    .preview { position: relative; background: #000; }
    .preview img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: #000; }
    .live-tag { position: absolute; top: 10px; left: 10px; display: none; align-items: center; gap: 6px;
      padding: 4px 9px; border-radius: 99px; background: rgba(0, 0, 0, .65); color: #fff;
      font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .preview.live .live-tag { display: inline-flex; }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #ff5a52;
      box-shadow: 0 0 0 3px rgba(255, 90, 82, .25); }
    .play { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      display: grid; place-items: center; width: 52px; height: 52px; padding: 0;
      border-radius: 50%; border: 1px solid rgba(255, 255, 255, .75);
      background: rgba(0, 0, 0, .55); color: #fff; cursor: pointer; opacity: .85;
      transition: opacity .15s ease, transform .15s ease; }
    .preview:hover .play, .play:focus-visible { opacity: 1; }
    .play:hover { transform: translate(-50%, -50%) scale(1.06); }
    .play svg { width: 24px; height: 24px; fill: currentColor; }
    .body { padding: 18px; }
    .card-head { display: flex; justify-content: space-between; align-items: center;
      gap: 12px; margin-bottom: 16px; }
    .card-head h2 { overflow-wrap: anywhere; }
    .meta { flex: none; display: flex; flex-wrap: wrap; align-items: center;
      justify-content: flex-end; gap: 4px 8px; font-size: 12px; color: var(--muted); }
    .host, .fw { white-space: nowrap; }
    .fw { padding: 2px 7px; border-radius: 99px; background: var(--code); font-size: 11px; }
    .section { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; }
    .card-head + .section { border-top: 0; padding-top: 0; margin-top: 0; }
    .section-title { margin-bottom: 9px; font-size: 11px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: .08em; }
    .field + .field { margin-top: 10px; }
    .label { display: block; margin-bottom: 5px; font-size: 11px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: .05em; }
    code { display: block; background: var(--code); color: var(--text); padding: 8px 10px;
      border-radius: 8px; font-size: 12px; line-height: 1.4; overflow-wrap: anywhere; user-select: all; }
    .buttons { display: flex; flex-wrap: wrap; gap: 7px; }
    .switches { display: grid; gap: 9px; margin-bottom: 14px; }
    .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px;
      font-size: 13px; font-weight: 600; cursor: pointer; }
    .switch-row input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .track { position: relative; flex: none; width: 38px; height: 22px; border-radius: 99px;
      background: var(--line); transition: background .15s ease; }
    .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px;
      border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .25);
      transition: transform .15s ease; }
    .switch-row input:checked + .track { background: var(--accent); }
    .switch-row input:checked + .track::after { transform: translateX(16px); }
    .switch-row input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
    dialog { width: min(440px, calc(100vw - 24px)); padding: 0; border: 1px solid var(--line);
      border-radius: 14px; background: var(--card); color: var(--text);
      box-shadow: 0 16px 48px rgba(0, 0, 0, .25); }
    dialog::backdrop { background: rgba(0, 0, 0, .45); }
    .modal { padding: 20px; }
    .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .modal h2 { margin: 0; font-size: 18px; }
    .modal .sub { margin: 4px 0 0; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
    .modal-close { border: 0; background: none; padding: 0 4px; font-size: 22px; line-height: 1; }
    .modal label { display: block; margin-top: 16px; font-size: 12px; font-weight: 600; color: var(--muted); }
    .modal label input { display: block; width: 100%; margin-top: 6px; padding: 10px 12px; font: inherit;
      font-size: 14px; border: 1px solid var(--line); border-radius: 9px;
      background: var(--card); color: var(--text); }
    .modal .wifi-result { min-height: 18px; margin: 12px 0 0; font-size: 13px; color: var(--muted); }
    .modal .wifi-result[data-kind="ok"] { color: var(--ok); }
    .modal .wifi-result[data-kind="err"] { color: var(--err); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    .empty { padding: 36px 22px; text-align: center; }
    .empty-icon { width: 44px; height: 44px; margin: 0 auto 14px; display: grid; place-items: center;
      border-radius: 12px; background: var(--accent-soft); color: var(--accent); font-size: 21px; }
    .empty h2 { font-size: 17px; margin: 0 0 5px; }
    .empty p { margin: 0 auto; max-width: 430px; font-size: 14px; color: var(--muted); }
    @media (max-width: 640px) {
      body { padding: 20px 12px 36px; }
      h1 { font-size: 23px; }
      .page-head { gap: 12px; }
      .head-actions { width: 100%; }
      .head-actions .btn-add { flex: 1; }
      .grid { grid-template-columns: 1fr; }
      .card-head { flex-direction: column; align-items: flex-start; gap: 4px; }
      .meta { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="page-head">
      <div class="page-head-main">
        <p class="eyebrow">A9 Camera · Overview</p>
        <h1>A9 Cameras</h1>
        <p class="lede">Live video and controls for cameras on your local network.</p>
        <p class="cam-count" id="cam-count">Cameras: …</p>
      </div>
      <div class="head-actions">
        <span class="dns-badge" id="dns-badge" data-kind="warn">DNS-Rewrite …</span>
        <a class="btn-add" data-rel="add" href="setup.html">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"
            stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          Add Camera
        </a>
      </div>
    </header>

    <div id="alert"></div>
    <div class="grid" id="cams"></div>
    <div class="card empty" id="empty" hidden>
      <div class="empty-icon">◎</div>
      <h2>No cameras connected</h2>
      <p>Cameras retry every few minutes after a restart. For a new camera in AP mode, use
        <b>Add Camera</b> above.</p>
    </div>
  </main>

  <dialog id="wifi-modal" aria-labelledby="wifi-modal-title">
    <div class="modal">
      <div class="modal-head">
        <div>
          <h2 id="wifi-modal-title">Change Wi-Fi</h2>
          <p class="sub" id="wifi-modal-cam"></p>
        </div>
        <button class="btn modal-close" id="wifi-close" type="button" aria-label="Close">×</button>
      </div>
      <label>New Wi-Fi name (SSID)
        <input id="wifi-ssid" autocomplete="off" spellcheck="false" placeholder="SSID">
      </label>
      <label>Password
        <input id="wifi-pwd" type="password" autocomplete="new-password" spellcheck="false"
               placeholder="At least 8 characters">
      </label>
      <p class="wifi-result" id="wifi-result" role="status"></p>
      <div class="modal-actions">
        <button class="btn" id="wifi-cancel" type="button">Cancel</button>
        <button class="btn primary" id="wifi-send" type="button">Change Wi-Fi</button>
      </div>
    </div>
  </dialog>

  <script>
    const host = location.hostname;
    // Resolve against the *directory* of this page: new URL(".", href) turns
    // /.../index.html into /.../ so links never become /index.html/xyz.
    const pageDir = new URL(".", location.href);
    const rel = path => new URL(path, pageDir).href;
    document.querySelector("[data-rel='add']").href = rel("setup.html");
    // Direct links deliberately use port 8557: the first open asks for the HA login.
    const direct = path => `http://${host}:8557/${path}`;
    const toggles = [
      ["IR LED", "IrLed", "code=202&amp;IrLed=1", "code=202&amp;IrLed=0"],
      ["Status LED", "instLed", "code=210&amp;instLed=1", "code=210&amp;instLed=0"],
      ["Flip image", "mirrorFlip", "code=216&amp;mirrorFlip=4", "code=216&amp;mirrorFlip=0"],
    ];
    const cards = {};

    const wifiModal = document.getElementById("wifi-modal");
    const wifiSSID = document.getElementById("wifi-ssid");
    const wifiPwd = document.getElementById("wifi-pwd");
    const wifiResult = document.getElementById("wifi-result");
    const wifiSend = document.getElementById("wifi-send");
    let wifiUID = null;

    function wifiStatus(text, kind = "") {
      wifiResult.textContent = text;
      wifiResult.dataset.kind = kind;
    }

    function openWiFi(uid) {
      wifiUID = uid;
      document.getElementById("wifi-modal-cam").textContent = `Connected camera · ${uid}`;
      wifiSSID.value = "";
      wifiPwd.value = "";
      wifiStatus("");
      wifiModal.showModal();
      wifiSSID.focus();
    }

    document.getElementById("wifi-close").onclick = () => wifiModal.close();
    document.getElementById("wifi-cancel").onclick = () => wifiModal.close();
    wifiModal.addEventListener("click", e => { if (e.target === wifiModal) wifiModal.close(); });

    wifiSend.onclick = async () => {
      const ssid = wifiSSID.value.trim();
      const pwd = wifiPwd.value;
      if (!ssid || pwd.length < 8) {
        wifiStatus("Enter an SSID and a password of at least 8 characters.", "err");
        return;
      }
      wifiSend.disabled = true;
      wifiStatus("Sending…");
      try {
        const res = await fetch(rel(`api/devices/${encodeURIComponent(wifiUID)}/wifi`), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ssid, password: pwd }),
        });
        if (!res.ok) throw new Error(await res.text());
        wifiStatus("Sent. The camera will reboot and reconnect.", "ok");
        wifiPwd.value = "";
      } catch (e) {
        wifiStatus(`Failed: ${e.message}`, "err");
      } finally {
        wifiSend.disabled = false;
      }
    };

    function card(cam) {
      const el = document.createElement("div");
      el.className = "card";
      el.innerHTML = `
        <div class="preview">
          <img alt="">
          <span class="live-tag"><span class="live-dot"></span>Live</span>
          <button class="play" type="button" aria-label="Live">
            <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
            <svg class="stop-icon" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M6 6h12v12H6z"/></svg>
          </button>
        </div>
        <div class="body">
          <div class="card-head">
            <h2></h2>
            <div class="meta"><span class="host"></span><span class="fw" hidden></span></div>
          </div>
          <div class="section">
            <div class="section-title">Streams</div>
            <div class="field"><div class="label">RTSP (MJPEG + audio)</div><code class="rtsp"></code></div>
            <div class="field"><div class="label">MJPEG</div><code class="mjpeg"></code></div>
            <div class="field"><div class="label">Snapshot</div><code class="snap"></code></div>
          </div>
          <div class="section">
            <div class="section-title">Controls</div>
            <div class="switches">
              ${toggles.map(([name, key, on, off]) => `
                <label class="switch-row"><span>${name}</span>
                  <input type="checkbox" class="toggle" data-key="${key}" data-on="${on}" data-off="${off}">
                  <span class="track" aria-hidden="true"></span>
                </label>`).join("")}
            </div>
            <div class="buttons">
              <a class="btn" target="_blank" data-rel="snapshot">Snapshot</a>
              <button class="btn" data-q="code=299&amp;reboot=1">Reboot</button>
              <button class="btn wifi wifi-open">Change Wi-Fi</button>
            </div>
          </div>
        </div>`;
      el.querySelector("h2").textContent = cam.uid;
      el.querySelector(".rtsp").textContent = `rtsp://${host}:8556/${cam.uid}`;
      // Direct links keep working; authMiddleware sends unknown browsers to the HA login page.
      el.querySelector(".mjpeg").textContent = direct(`dev/${cam.uid}/live`);
      el.querySelector(".snap").textContent = direct(`dev/${cam.uid}/snapshot`);
      el.querySelector('[data-rel="snapshot"]').href = rel(`dev/${cam.uid}/snapshot`);

      el.querySelector(".wifi-open").onclick = () => openWiFi(cam.uid);
      const preview = el.querySelector(".preview");
      const img = el.querySelector("img");
      const playBtn = el.querySelector(".play");
      const playIcon = el.querySelector(".play-icon");
      const stopIcon = el.querySelector(".stop-icon");
      let stop = null;
      function liveEnded() {
        stop = null;
        playIcon.hidden = false;
        stopIcon.hidden = true;
        playBtn.setAttribute("aria-label", "Live");
        preview.classList.remove("live");
        img.src = rel(`dev/${cam.uid}/snapshot?t=${Date.now()}`);
      }
      playBtn.onclick = () => {
        if (stop) { stop(); return; }
        stop = play(img, cam.uid, liveEnded);
        playIcon.hidden = true;
        stopIcon.hidden = false;
        playBtn.setAttribute("aria-label", "Stop");
        preview.classList.add("live");
      };
      el.querySelectorAll(".toggle").forEach(t => {
        t.onchange = () => {
          const q = t.checked ? t.dataset.on : t.dataset.off;
          // Keep the new position until the camera reports its base info again.
          t.dataset.pending = String(Date.now() + 5000);
          fetch(rel(`dev/${cam.uid}/cmd?${q}`)).catch(() => {});
        };
      });
      el.querySelectorAll("button[data-q]").forEach(b =>
        b.onclick = () => fetch(rel(`dev/${cam.uid}/cmd?${b.dataset.q}`)));
      img.src = rel(`dev/${cam.uid}/snapshot?t=${Date.now()}`);
      return el;
    }

    // Shows the live stream in img. Not <img src=live>: HA ingress compresses multipart
    // responses and drops the boundary, so nothing would show. Reads the parts here instead.
    // Returns a function that stops it; onEnd runs once when it ends.
    function play(img, uid, onEnd) {
      const ctrl = new AbortController();
      const dec = new TextDecoder();
      let url = null;
      (async () => {
        const res = await fetch(rel(`dev/${uid}/live?raw`), { signal: ctrl.signal });
        if (!res.ok) throw new Error(res.status);
        const reader = res.body.getReader();
        let buf = new Uint8Array(0);
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          const b = new Uint8Array(buf.length + value.length);
          b.set(buf); b.set(value, buf.length); buf = b;
          // each part: "--frame\r\nContent-Type: image/jpeg\r\nContent-Length: N\r\n\r\n" JPEG "\r\n"
          for (;;) {
            let end = -1;
            for (let i = 0; i + 3 < buf.length; i++) {
              if (buf[i] === 13 && buf[i + 1] === 10 && buf[i + 2] === 13 && buf[i + 3] === 10) { end = i; break; }
            }
            if (end < 0) break;
            const m = dec.decode(buf.subarray(0, end)).match(/Content-Length: (\d+)/i);
            const len = m ? +m[1] : 0;
            if (buf.length < end + 4 + len + 2) break;
            const jpeg = buf.slice(end + 4, end + 4 + len);
            buf = buf.slice(end + 4 + len + 2);
            if (url) URL.revokeObjectURL(url);
            url = URL.createObjectURL(new Blob([jpeg], { type: "image/jpeg" }));
            img.src = url;
          }
        }
      })().catch(() => {}).finally(() => {
        if (url) URL.revokeObjectURL(url);
        onEnd();
      });
      return () => ctrl.abort();
    }

    async function update() {
      let list, st;
      try {
        [list, st] = await Promise.all([
          fetch(rel("dev/list")).then(r => {
            if (!r.ok) throw new Error(r.status);
            return r.json();
          }),
          fetch(rel("api/status")).then(r => r.json()).catch(() => null),
        ]);
      } catch (e) {
        document.getElementById("empty").hidden = true;
        document.getElementById("cam-count").textContent = "Cameras: –";
        document.getElementById("dns-badge").textContent = "DNS-Rewrite …";
        document.getElementById("dns-badge").dataset.kind = "warn";
        return;
      }
      document.getElementById("cam-count").textContent = `Cameras: ${list.length}`;
      const dns = document.getElementById("dns-badge");
      dns.textContent = `DNS-Rewrite ${st ? (st.dns_ok ? "✓" : "✗") : "…"}`;
      dns.dataset.kind = st ? (st.dns_ok ? "ok" : "bad") : "warn";
      const alert = document.getElementById("alert");
      alert.innerHTML = st && !st.dns_ok ?
        `<div class="alert"><b>DNS redirect missing.</b> <code>${st.dns_name}</code> resolves to ` +
        `<code>${st.dns_ip || "nothing"}</code>, but this host is ` +
        `<code>${(st.local_ips || []).join(", ") || "unknown"}</code>. ` +
        `Set the DNS rewrites for <code>*.naxclow.com</code> and <code>*.naxclow.com.cn</code> ` +
        `in your router/AdGuard, then restart the cameras.</div>` : "";
      document.getElementById("empty").hidden = list.length !== 0;
      const seen = new Set();
      for (const cam of list) {
        seen.add(cam.uid);
        if (!cards[cam.uid]) {
          cards[cam.uid] = card(cam);
          document.getElementById("cams").appendChild(cards[cam.uid]);
        }
        const c = cards[cam.uid];
        c.querySelector(".host").textContent = cam.host;
        const version = cam.info && cam.info.version;
        const fw = c.querySelector(".fw");
        fw.hidden = !version;
        fw.textContent = version ? String(version) : "";
        c.querySelectorAll(".toggle").forEach(t => {
          if (Date.now() < Number(t.dataset.pending || 0)) return;
          const value = cam.info && cam.info[t.dataset.key];
          if (value === undefined || value === null) return;
          t.checked = t.dataset.key === "mirrorFlip"
            ? Number(value) !== 0
            : Number(value) === 1;
        });
      }
      for (const uid of Object.keys(cards)) {
        if (!seen.has(uid)) { cards[uid].remove(); delete cards[uid]; }
      }
    }

    update();
    setInterval(() => { if (!document.hidden) update(); }, 2000);
  </script>
</body>
</html>
